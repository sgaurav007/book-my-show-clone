server:
  port: 8080

spring:
  application:
    name: api-gateway-test

  cloud:
    gateway:
      httpclient:
        connect-timeout: 1000
        response-timeout: 5s

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: bookmyshow-super-secret-key-change-in-production-minimum-256-bits-required-for-hmac-sha256-algorithm
  expiration: 86400000

services:
  user-service:
    url: http://localhost:8081
  catalog-service:
    url: http://localhost:8082
  booking-service:
    url: http://localhost:8083
  payment-service:
    url: http://localhost:8084

logging:
  level:
    root: ERROR
    com.bookmyshow.gateway: DEBUG
